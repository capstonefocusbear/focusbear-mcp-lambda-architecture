# Manual workflow for urgent hotfixes. Does NOT run tests or audits — deploys current branch straight to AWS production.
# Use only when speed is critical; normal changes should go through main and the full CI pipeline.
name: Hotfix Deploy to AWS Production (manual)

on:
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.PROD_AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        run: |
          docker build -f Dockerfile.aws -t backend .
          docker tag backend ${{ vars.PROD_ECR_REGISTRY }}/${{ vars.PROD_ECR_REPO }}:${GITHUB_SHA}
          docker push ${{ vars.PROD_ECR_REGISTRY }}/${{ vars.PROD_ECR_REPO }}:${GITHUB_SHA}

  deploy-image:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.PROD_AWS_REGION }}

      - name: Update Server Stack with new image
        run: |
          aws cloudformation update-stack \
            --stack-name ${{ vars.PROD_SERVER_STACK_NAME }} \
            --use-previous-template \
            --parameters ParameterKey=imageTag,ParameterValue=${{ github.sha }} \
            --capabilities CAPABILITY_IAM

      - name: Update Cron Stack with new image
        run: |
          aws cloudformation update-stack \
            --stack-name ${{ vars.PROD_CRON_STACK_NAME }} \
            --use-previous-template \
            --parameters ParameterKey=imageTag,ParameterValue=${{ github.sha }} \
            --capabilities CAPABILITY_IAM
