name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
      fail-fast: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm

      - name: Install safe-chain (CI)
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.4.4/install-safe-chain.sh | sh -s -- --ci

      - name: Install npm dependencies
        run: npm ci

      - name: Build via npm
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Security audit of dependencies
        run: npm audit --production --audit-level=critical

      - name: Lint code
        run: npm run lint

      - name: Run unit tests and check coverage (should be > 80%)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run test:cov

  smoke:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      SERVER_PORT: "5038"
      SERVER_HOST: "0.0.0.0"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      REDIS_HOSTNAME: localhost
      REDIS_PORT: "6379"
      TYPEORM_ENCRYPTION_KEY: "00000000000000000000000000000000"
      FIELD_TRANSFORMER_ENCRYPTION_KEY: "00000000000000000000000000000000"
      AUTH0_DOMAIN: https://example.auth0.com/
      AUTH0_IDENTIFIER: https://example.auth0.com/api/v2/
      PUSHER_BEAMS_INSTANCE_ID: "ci-dummy-instance"
      PUSHER_BEAMS_PRIMARY_KEY: "ci-dummy-key"
      SENDGRID_KEY: "SG.ci-dummy-key-for-smoke-test"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm

      - name: Install safe-chain (CI)
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.4.4/install-safe-chain.sh | sh -s -- --ci

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Run migrations
        run: npm run migration:up

      - name: Start server and run smoke tests
        run: |
          npm run start:no-migration > server.log 2>&1 &
          export SERVER_URL=http://127.0.0.1:5038
          export MAX_RETRIES=15
          export RETRY_INTERVAL=2
          export SMOKE_DEBUG=1
          npm run smoke-test
          EXIT=$?
          kill %1 2>/dev/null || true
          exit $EXIT

      - name: Show server log on smoke failure
        if: failure()
        run: |
          echo "=== Server log (last 80 lines) ==="
          tail -80 server.log || true

      - name: Upload server log on smoke failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-server-log
          path: server.log
          retention-days: 7
          if-no-files-found: warn

  # App startup check: verifies API server entrypoint starts and stays up. Same services/env as smoke.
  # Failure dependency: continue-on-error so when this check fails, the pipeline still passes —
  # the website (API) can still run and be deployed.
  app-startup:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      SERVER_PORT: "5038"
      SERVER_HOST: "0.0.0.0"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      REDIS_HOSTNAME: localhost
      REDIS_PORT: "6379"
      TYPEORM_ENCRYPTION_KEY: "00000000000000000000000000000000"
      FIELD_TRANSFORMER_ENCRYPTION_KEY: "00000000000000000000000000000000"
      PUSHER_BEAMS_INSTANCE_ID: "ci-dummy-instance"
      PUSHER_BEAMS_PRIMARY_KEY: "ci-dummy-key"
      SENDGRID_KEY: "SG.ci-dummy-key-for-smoke-test"
      AUTH0_DOMAIN: https://example.auth0.com/
      AUTH0_IDENTIFIER: https://example.auth0.com/api/v2/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm

      - name: Install safe-chain (CI)
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.4.4/install-safe-chain.sh | sh -s -- --ci

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Run migrations
        run: npm run migration:up

      - name: Verify app entrypoint starts successfully
        env:
          WORKER_CMD: "node dist/apps/api-server/main.js"
          WORKER_STABILITY_SECONDS: "15"
          WORKER_HEALTHCHECK_URL: "http://127.0.0.1:5038/healthcheck"
          WORKER_HEALTHCHECK_RETRIES: "10"
          WORKER_HEALTHCHECK_INTERVAL: "2"
          WORKER_DEBUG: "1"
        run: bash scripts/worker-startup-check.sh

      - name: Upload startup log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-startup-log
          path: worker.log
          retention-days: 7
