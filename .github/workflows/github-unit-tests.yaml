name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
      fail-fast: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install npm dependencies
        run: npm ci

      - name: Build via npm
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Security audit of dependencies
        run: npm audit --production --audit-level=critical

      - name: Lint code
        run: npm run lint

      - name: Run unit tests and check coverage (should be > 80%)
        run: npm run test:cov
