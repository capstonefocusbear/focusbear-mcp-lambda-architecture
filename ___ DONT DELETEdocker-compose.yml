version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.aws
    ports:
      - "4000:4000"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
    environment:
      - NODE_ENV=development
      - SERVER_PORT=4000
      - SERVER_HOST=0.0.0.0
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - PGSSLMODE=disable
      - POSTGRES_SSL=false
      - DB_SSL=false
      - REDIS_HOSTNAME=redis
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - db
      - redis
      - localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  localstack:
    image: localstack/localstack:4.1.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=secretsmanager
    volumes:
      - "./localstack_data:/var/lib/localstack"


  db:
    image: pgvector/pgvector:pg16-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: testpass1122
    volumes:
      - .dbdata:/var/lib/postgresql/data
    ports:
      - "54322:5432"

  # GUI for DB
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    image: redis:6.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

