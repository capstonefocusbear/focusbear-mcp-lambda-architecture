    vars:
      appName: "Visual Studio Code"
      focusMode: "work"
      intention: "programming"
      justificationForThisSpecificApp: "Writing code for my project"
      currentTaskInToDoPlayer: "Implement feature X for project"
      min_probability: 0.7
      max_probability: 1.0
    assert:
      - type: javascript
        value: file://validate-probability.js
  
