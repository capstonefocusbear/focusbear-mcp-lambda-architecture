prompts:
  - id: habit-import-image
    raw: file://prompt.json


providers:
  - id: openai:gpt-5.2
    config:
      temperature: 0
      max_tokens: 2048
      apiKeyEnvar: OPENAI_API_KEY

output:
  - debug
  - json

tests:
  - description: "Simple morning routine screenshot"
    vars:
      url: https://ibb.co/rfddRs2b
      min_habits: 3
      max_habits: 5
      expected_categories: ["Do room", "Clean desk", "Go to gym"]
    assert:
      - type: javascript
        value: file://validate-extraction.js
