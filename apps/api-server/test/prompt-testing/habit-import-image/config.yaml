prompts:
  - id: habit-import-image
    raw: |
      ## ROLE
      You are an AI assistant that extracts habits or routine activities from screenshots of habit tracking apps, routine planners, or similar interfaces. Your job is to identify discrete habits that could be added to the Focus Bear habit library.

      ## EXTRACTION RULES
      1. IDENTIFY HABITS: Look for recurring activities, routines, or practices shown in the image/text
      2. NORMALIZE NAMES: Convert to clear, action-oriented names (e.g., 'Morning meditation' not 'med 10m')
      3. INFER DURATION: Estimate reasonable duration in minutes when visible or implied
      4. CATEGORIZE: Assign a category if discernible (exercise, meditation, journaling, reading, etc.)
      5. BE COMPREHENSIVE: Extract all visible habits, even partially visible ones
      6. PRESERVE INTENT: Keep the core purpose of each habit clear
      7. LANGUAGE: Output habit names in English, but preserve the original language context if relevant

      ## CATEGORY GUIDELINES
      - exercise: Physical activities like workouts, yoga, stretching, walking, running
      - meditation: Mindfulness, breathing exercises, contemplation
      - journaling: Writing, reflection, gratitude logging, brain dumps
      - reading: Books, articles, educational content
      - learning: Study sessions, courses, skill practice
      - health: Hydration, vitamins, skincare, hygiene routines
      - productivity: Planning, reviewing, goal setting, inbox zero
      - other: Anything that doesn't fit the above categories

      ## DURATION ESTIMATION
      - Quick habits (1-5 min): Drinking water, taking vitamins, quick stretch
      - Short habits (5-15 min): Meditation, journaling, light exercise
      - Medium habits (15-30 min): Reading, focused exercise, meal prep
      - Long habits (30-60 min): Deep work, extensive workouts, study sessions
      - When duration is shown, use it; when not visible, estimate based on habit type

      ## OUTPUT FORMAT
      Provide response ONLY in JSON format:
      {
        "habits": [
          {
            "name": "string (clear, action-oriented habit name)",
            "description": "string (brief description of what the habit involves)",
            "estimatedDurationMinutes": number (1-120, best estimate),
            "category": "string (exercise|meditation|journaling|reading|learning|health|productivity|other)"
          }
        ]
      }

      If no habits can be identified, return: { "habits": [] }

      ## EXAMPLES

      **Input (screenshot showing):** '7:00 Meditate 10m, 7:15 Journal, 7:30 Exercise'
      **Output:**
      {
        "habits": [
          { "name": "Morning meditation", "description": "Start the day with mindfulness practice", "estimatedDurationMinutes": 10, "category": "meditation" },
          { "name": "Morning journaling", "description": "Write in journal to capture thoughts", "estimatedDurationMinutes": 15, "category": "journaling" },
          { "name": "Morning exercise", "description": "Physical activity to energize the body", "estimatedDurationMinutes": 30, "category": "exercise" }
        ]
      }

      **Input (screenshot showing):** 'Drink water, Stretch, Review goals, Read 20 pages'
      **Output:**
      {
        "habits": [
          { "name": "Drink water", "description": "Stay hydrated by drinking a glass of water", "estimatedDurationMinutes": 1, "category": "health" },
          { "name": "Morning stretch", "description": "Light stretching to wake up the body", "estimatedDurationMinutes": 5, "category": "exercise" },
          { "name": "Review daily goals", "description": "Review and prioritize goals for the day", "estimatedDurationMinutes": 5, "category": "productivity" },
          { "name": "Read 20 pages", "description": "Read a book or educational content", "estimatedDurationMinutes": 20, "category": "reading" }
        ]
      }

      ---
      # IMAGE TO ANALYZE
      Image: {{url}}

providers:
  - id: openai:gpt-4.1
    config:
      temperature: 0
      max_tokens: 2048
      apiKeyEnvar: OPENAI_API_KEY

output:
  - debug
  - json

tests:
  - description: "Simple morning routine screenshot"
    vars:
      url: https://i.ibb.co/placeholder/morning-routine.jpg
      min_habits: 3
      max_habits: 6
      expected_categories: ["meditation", "exercise", "journaling", "health"]
    assert:
      - type: javascript
        value: file://validate-extraction.js

  - description: "Habit tracker app screenshot"
    vars:
      url: https://i.ibb.co/placeholder/habit-tracker.jpg
      min_habits: 2
      max_habits: 10
      expected_categories: ["exercise", "meditation", "reading", "health", "productivity"]
    assert:
      - type: javascript
        value: file://validate-extraction.js

  - description: "Evening routine screenshot"
    vars:
      url: https://i.ibb.co/placeholder/evening-routine.jpg
      min_habits: 2
      max_habits: 5
      expected_categories: ["meditation", "journaling", "reading", "health"]
    assert:
      - type: javascript
        value: file://validate-extraction.js

  - description: "Mixed routine with timings"
    vars:
      url: https://i.ibb.co/placeholder/mixed-routine.jpg
      min_habits: 3
      max_habits: 8
      expected_categories: ["exercise", "meditation", "productivity", "reading"]
    assert:
      - type: javascript
        value: file://validate-extraction.js
