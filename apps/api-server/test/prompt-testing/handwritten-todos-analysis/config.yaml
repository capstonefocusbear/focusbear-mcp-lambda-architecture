prompts:   
  - id: handwritten-todos-analysis
    file: prompt.json

providers:
  - id: openai:gpt-4.1
    config:
      temperature: 0
      max_tokens: 1024
      apiKeyEnvar: $OPENAI_API_KEY

output:
  - debug
  - json

tests:
  - description: "Simple grocery list"
    vars:
      url: https://i.ibb.co/G3v6dY78/grocery-list.jpg
      min_tasks: 1
      max_tasks: 1
      expected_task_names: ["Buy groceries"]
      min_estimated_time: 20
      max_estimated_time: 45
    assert:
      - type: javascript
        value: file://validate-todos.js

  - description: "Multiple independent tasks"
    vars:
      url: https://i.ibb.co/V0ZHJ6Z6/independent-tasks.jpg
      min_tasks: 3
      max_tasks: 3
      expected_task_names: ["Call mom", "Review quarterly report", "Schedule dentist appointment"]
      min_estimated_time: 10
      max_estimated_time: 120
    assert:
      - type: javascript
        value: file://validate-todos.js

  - description: "Complex task with subtasks"
    vars:
      url: https://i.ibb.co/kVc23D0h/task-with-subtasks.jpg
      max_tasks: 1
      expected_task_names: ["Prepare presentation"]
      min_subtasks: 2
      max_subtasks: 4
      min_estimated_time: 60
      max_estimated_time: 180
    assert:
      - type: javascript
        value: file://validate-todos.js

  - description: "Mixed format tasks"
    vars:
      url: https://i.ibb.co/S40yvHwL/mixed-format-tasks.jpg
      min_tasks: 3
      max_tasks: 4
      expected_task_names: ["Buy groceries", "Call mom", "Review project docs", "Schedule meeting"]
      min_estimated_time: 10
      max_estimated_time: 120
    assert:
      - type: javascript
        value: file://validate-todos.js

  - description: "Work-related tasks"
    vars:
      url: https://i.ibb.co/hxgkQNcB/work-tasks.jpg
      min_tasks: 3
      max_tasks: 3
      expected_task_names: ["Send follow-up emails", "Update project timeline", "Prepare for team meeting"]
      min_estimated_time: 15
      max_estimated_time: 90
    assert:
      - type: javascript
        value: file://validate-todos.js

  - description: "Study tasks"
    vars:
      url: https://i.ibb.co/jZzJrgH9/study-tasks.jpg
      min_tasks: 3
      max_tasks: 3
      expected_task_names: ["Read chapter 5", "Complete practice problems", "Review notes for exam"]
      min_estimated_time: 30
      max_estimated_time: 180
    assert:
      - type: javascript
        value: file://validate-todos.js

  - description: "Personal tasks"
    vars:
      url: https://i.ibb.co/Gv5Mhbwv/personal-tasks.jpg
      min_tasks: 4
      max_tasks: 4
      expected_task_names: ["Pay bills", "Clean kitchen", "Walk dog", "Call insurance company"]
      min_estimated_time: 10
      max_estimated_time: 120
    assert:
      - type: javascript
        value: file://validate-todos.js

  - description: "Task with subtasks should nest correctly"
    vars:
      url: "https://i.ibb.co/5hfhcWcR/task-subtask-nest.jpg"
      min_tasks: 3
      max_tasks: 3
      expected_task_names: ["Clean house", "Prepare lunch", "Plan birthday party"]
      min_subtasks: 2
      max_subtasks: 4
      min_estimated_time: 60
      max_estimated_time: 180
    assert:
      - type: javascript
        value: file://validate-todos.js

  - description: "Exclude completed tasks from fresh tasks"
    vars:
      url: https://i.ibb.co/tPLR4X3V/exclude-completed-tasks.jpg
      min_tasks: 2
      max_tasks: 2
      expected_task_names: ["Schedule dentist appointment", "Buy groceries"]
      min_estimated_time: 10
      max_estimated_time: 120
    assert:
      - type: javascript
        value: file://validate-todos.js
