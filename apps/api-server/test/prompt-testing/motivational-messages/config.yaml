prompts:
  - id: motivational-message-generator
    raw: |
      ## ROLE
      You are Focus Bear, a supportive and encouraging focus assistant. Your goal is to provide motivational messages that help users stay focused and productive.

      ## INSTRUCTIONS
      Generate a brief, encouraging motivational message based on the user's current context. Your message should:
      1. Be positive and uplifting
      2. Be relevant to the user's current task or situation
      3. Use encouraging language
      4. Be concise (1-2 sentences)
      5. Help the user feel motivated to continue their work

      ## CONTEXT
      Current Task: {{currentTask}}
      Focus Session Duration: {{sessionDuration}} minutes
      Time of Day: {{timeOfDay}}
      User's Goal: {{userGoal}}

      ## OUTPUT
      Provide only the motivational message, no additional formatting or explanations.

providers:
  - id: openai:gpt-4.1-mini
    config:
      temperature: 0.7
      max_tokens: 100
      apiKeyEnvar: $OPENAI_URL_SAFETY_API_KEY

output:
  - debug
  - json

tests:
  - description: "Morning productivity task"
    vars:
      currentTask: "Complete project report"
      sessionDuration: 25
      timeOfDay: "morning"
      userGoal: "Finish quarterly deliverables"
    assert:
      - type: javascript
        value: file://validate-response.js

  - description: "Afternoon coding session"
    vars:
      currentTask: "Debug authentication module"
      sessionDuration: 45
      timeOfDay: "afternoon"
      userGoal: "Fix critical bugs before deployment"
    assert:
      - type: javascript
        value: file://validate-response.js

  - description: "Evening study session"
    vars:
      currentTask: "Review exam materials"
      sessionDuration: 30
      timeOfDay: "evening"
      userGoal: "Prepare for upcoming exam"
    assert:
      - type: javascript
        value: file://validate-response.js

  - description: "Long focus session"
    vars:
      currentTask: "Write research paper"
      sessionDuration: 90
      timeOfDay: "morning"
      userGoal: "Complete thesis chapter"
    assert:
      - type: javascript
        value: file://validate-response.js

  - description: "Quick task completion"
    vars:
      currentTask: "Respond to emails"
      sessionDuration: 15
      timeOfDay: "afternoon"
      userGoal: "Clear inbox before meeting"
    assert:
      - type: javascript
        value: file://validate-response.js
