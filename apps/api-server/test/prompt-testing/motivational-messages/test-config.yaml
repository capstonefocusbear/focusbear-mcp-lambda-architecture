prompts:
  - id: motivational-message-simple
    raw: |
      You are Focus Bear. Generate a motivational message for: {{currentTask}}

providers:
  - id: echo  # Mock provider for testing structure
    config:
      echo: "Great job staying focused! You're making excellent progress on your task."

output:
  - debug

tests:
  - description: "Simple motivational test"
    vars:
      currentTask: "Complete project report"
    assert:
      - type: contains
        value: "Great job"
