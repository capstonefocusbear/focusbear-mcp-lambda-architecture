      should_match_existing: true
      expected_task_id: "task-dev-123"
      existing_task_ids: ["task-dev-123", "task-meetings-456"]
    assert:
      - type: javascript
        value: file://../validate-task-suggestion.js

  # Test 6: Safari with only unrelated tasks - should suggest new task
  - description: "Safari with only unrelated tasks - should suggest new task"
    vars:
      app_name: "Safari"
      focus_mode: "Work"
      current_tasks_list: |
        - task_name: "Water the plants"
          task_id: "task-plants-123"
        - task_name: "Call mom"
          task_id: "task-call-456"
      input_wrapper: "```"
      should_suggest_new: true
      existing_task_ids: ["task-plants-123", "task-call-456"]
    assert:
      - type: javascript
        value: file://../validate-task-suggestion.js

  # Test 7: Xcode with iOS development task - SHOULD match (specialized app)
  - description: "Xcode with iOS development task - should match existing task"
    vars:
      app_name: "Xcode"
      focus_mode: "Deep Work"
      current_tasks_list: |
