      existing_task_ids: ["task-comms-123", "task-review-456"]
    assert:
      - type: javascript
        value: file://../validate-task-suggestion.js

  # Test 11: Calculator app with coding task as current task - should suggest new task
  - description: "Calculator app with coding task - should suggest new task, not current task"
    vars:
      app_name: "Calculator"
      focus_mode: "Deep Work"
      current_task_in_todo_player: "Fix backend API bug"
