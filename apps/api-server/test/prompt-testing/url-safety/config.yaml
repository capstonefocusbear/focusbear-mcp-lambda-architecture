providers:
  - id: openai:gpt-4o-mini
    config:
      temperature: 0
      max_tokens: 1024
      apiKeyEnvar: $OPENAI_API_KEY

output:
  - debug
  - json

assertions:
  - type: json-schema
    valid: true
  - type: contains-json
    key: allowed_probability
    condition: number
  - type: contains-json
    key: reason
    condition: string
  - type: similarity-score
    threshold: 0.8
    value: '{"allowed_probability": 1.0, "reason": "Directly related to work tasks"}'
    cases:
      - vars: 
          url: https://docs.google.com
          focus_mode: work
          intention: documentation
