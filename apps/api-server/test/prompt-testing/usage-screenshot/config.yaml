prompts:
  # - id:usage-screenshot-analysis
  - file://prompt.json

providers:
  - id: openai:gpt-4.1
    config:
      temperature: 0
      max_tokens: 1024
      # apiKey: ${OPENAI_API_KEY}

output:
  - debug
  - json

tests:
  - description: "iPhone Screen Time Summary Analysis #1"
    vars:
      url: https://i.ibb.co/zVxRsvZj/IMG-9140.png
      image_description: iPhone Screen Time summary showing app usage statistics
      image_type: screenshot
    assert:
      - type: javascript
        value: file://validate-probability.js 
        config:
          expectedApps:
            - sourceName: "Messenger"
              minutesUsedTotal: 21
              category: "SOCIAL"
            - sourceName: "Settings"
              minutesUsedTotal: 17
              category: "SYSTEM"
            - sourceName: "Focus Bear"
              minutesUsedTotal: 14
              category: "PRODUCTIVITY"
            - sourceName: "Gmail"
              minutesUsedTotal: 8
              category: "PRODUCTIVITY"
            - sourceName: "Cliq"
              minutesUsedTotal: 8
              category: "PRODUCTIVITY"
            - sourceName: "Slack"
              minutesUsedTotal: 8
              category: "PRODUCTIVITY"
            - sourceName: "Health"
              minutesUsedTotal: 7
              category: "Health & Fitness"
            - sourceName: "Discord"
              minutesUsedTotal: 6
              category: "SOCIAL"
            - sourceName: "Telegram"
              minutesUsedTotal: 4
              category: "SOCIAL"
            - sourceName: "Zalo"
              minutesUsedTotal: 4
              category: "SOCIAL"
            - sourceName: "Chrome"
              minutesUsedTotal: 4
              category: "PRODUCTIVITY"
            - sourceName: "VCB Digibank"
              minutesUsedTotal: 4
              category: "FINANCE"

  - description: "iPhone Screen Time Summary Analysis #2"
    vars:
      url: https://i.ibb.co/fV9cBySm/IMG-9141.png
      image_description: iPhone Screen Time summary showing app usage statistics
      image_type: screenshot  
    assert:
      - type: javascript
        value: file://validate-probability.js
        config:
          expectedApps:
            - sourceName: "Gmail"
              minutesUsedTotal: 34
              category: "PRODUCTIVITY"
            - sourceName: "ShopeeFood"
              minutesUsedTotal: 27
              category: "MISC"
            - sourceName: "Messenger"
              minutesUsedTotal: 27
              category: "SOCIAL"
            - sourceName: "Chrome"
              minutesUsedTotal: 25
              category: "PRODUCTIVITY"
            - sourceName: "Instagram"
              minutesUsedTotal: 22
              category: "SOCIAL"
            - sourceName: "Slack"
              minutesUsedTotal: 20
              category: "PRODUCTIVITY"
            - sourceName: "Cliq"
              minutesUsedTotal: 14
              category: "PRODUCTIVITY"
            - sourceName: "Camera"
              minutesUsedTotal: 12
              category: "IMAGE"
            - sourceName: "Shopee"
              minutesUsedTotal: 10
              category: "MISC"
            - sourceName: "MoMo"
              minutesUsedTotal: 8
              category: "FINANCE"
            - sourceName: "Photos"
              minutesUsedTotal: 8
              category: "IMAGE"
            - sourceName: "Wallet"
              minutesUsedTotal: 8
              category: "FINANCE"

  - description: "iPhone Screen Time Summary Analysis #3 (FAIL CASE)"
    vars:
      url: https://i.ibb.co/DP9XwWMC/IMG-9149.png
      image_description: iPhone Screen Time summary showing app usage statistics
      image_type: screenshot
    assert:
      - type: javascript
        value: file://validate-probability.js 
        config:
          expectedApps: [] 