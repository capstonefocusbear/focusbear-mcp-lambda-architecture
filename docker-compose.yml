  # - redis
  # - localstack
  # volumes:
  # - .:/app
  # - /app/node_modules
  # command: npx nest start mcp-server --watch
  # command: npm run simulate

  db:
    image: pgvector/pgvector:pg16-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: testpass1122
    volumes:
      - .dbdata:/var/lib/postgresql/data
    ports:
      - '54322:5432'

  # GUI for DB
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    image: redis:6.2-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

