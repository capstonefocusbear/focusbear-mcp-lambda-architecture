version: '3.9'

services:
  api-server:
    build:
      context: .
      dockerfile: ./apps/api-server/Dockerfile.api
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=4000
      - SERVER_PORT=4000
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOSTNAME=redis
      - AWS_SDK_JS_SUPPRESS_MAINTENANCE_MODE_MESSAGE=1
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
      # - localstack
    volumes:
      - .:/app
      # - /app/node_modules
    command: npx nest start api-server --watch

  # mcp-server:
  # build:
  # context: .
