AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LOCAL ONLY (Task 33). LocalStack variant of template.yaml, aligned where
  possible with Practical Architectural Design v2.0 (21 Oct 2026): regional REST
  API, reserved concurrency 10, one-month logs, error-rate and p95 alarms.
  Known gaps vs v2.0: SAM instead of CDK, zip + lambda-local.js instead of the
  Web Adapter container image, and a signing-key secret that the current adapter
  code still requires (v2.0 moves signing to Auth0). Do not deploy to AWS.

Parameters:
  Stage:
    Type: String
    Default: local
  ApiServerUrl:
    Type: String
  OAuthIssuer:
    Type: String
  OAuthJwksUrl:
    Type: String
  McpResourceUrl:
    Type: String
    Default: https://example.invalid/mcp
  InternalServiceSecretName:
    Type: String
    Default: focusbear-mcp/dev/internal-service-key
  SigningKeySecretName:
    Type: String
    Default: focusbear-mcp/local/adapter-signing-key
    Description: Secret holding {"kid", "privateKey"} for the adapter's token-exchange signing key.
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: v2.0 section 9 - keep application logs for one month.
  ReservedConcurrency:
    Type: Number
    Default: 10
    Description: v2.0 sections 10 and 11 - backend has one task and a DB pool of 10.

Resources:
  McpRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub focusbear-mcp-${Stage}
      StageName: !Ref Stage
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10

  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub focusbear-mcp-${Stage}
      Description: MCP Streamable HTTP adapter (apps/mcp-server), local LocalStack build.
      CodeUri: build/
      Handler: lambda-local.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 15
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${InternalServiceSecretName}-*
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SigningKeySecretName}-*
      Environment:
        Variables:
          MCP_RESOURCE_URL: !Ref McpResourceUrl
          API_SERVER_URL: !Ref ApiServerUrl
          OAUTH_ISSUER: !Ref OAuthIssuer
          OAUTH_JWKS_URL: !Ref OAuthJwksUrl
          MCP_PORT: '5039'
          NODE_ENV: production
          INTERNAL_SERVICE_SECRET_NAME: !Ref InternalServiceSecretName
          SIGNING_KEY_SECRET_NAME: !Ref SigningKeySecretName
      Events:
        Mcp:
          Type: Api
          Properties:
            RestApiId: !Ref McpRestApi
            Path: /mcp
            Method: ANY
        ProtectedResourceMetadata:
          Type: Api
          Properties:
            RestApiId: !Ref McpRestApi
            Path: /.well-known/oauth-protected-resource
            Method: GET

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/focusbear-mcp-${Stage}
      RetentionInDays: !Ref LogRetentionDays

  # v2.0 section 9: Lambda error rate above 5% over five minutes.
  ErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub focusbear-mcp-${Stage}-error-rate
      AlarmDescription: Lambda error rate above 5 percent over five minutes.
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: errorRate
          Label: Error rate (%)
          Expression: IF(invocations > 0, 100 * errors / invocations, 0)
          ReturnData: true
        - Id: errors
          ReturnData: false
          MetricStat:
            Period: 300
            Stat: Sum
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref McpFunction
        - Id: invocations
          ReturnData: false
          MetricStat:
            Period: 300
            Stat: Sum
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref McpFunction

  # v2.0 section 9: p95 latency above three seconds.
  DurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub focusbear-mcp-${Stage}-p95-duration
      AlarmDescription: Lambda p95 duration above three seconds over five minutes.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref McpFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # v2.0 section 9: unexpected throttles.
  ThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub focusbear-mcp-${Stage}-throttles
      AlarmDescription: Lambda throttled at least one request in five minutes.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref McpFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  McpUrl:
    Value: !Sub https://${McpRestApi}.execute-api.localhost.localstack.cloud:4566/${Stage}/mcp
  MetadataUrl:
    Value: !Sub https://${McpRestApi}.execute-api.localhost.localstack.cloud:4566/${Stage}/.well-known/oauth-protected-resource
  FunctionName:
    Value: !Ref McpFunction
