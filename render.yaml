previewsEnabled: true
previewsExpireAfterDays: 1

services:
- type: web
  name: eyst-backend-prod
  env: docker
  plan: standard
  healthCheckPath: /healthcheck
  autoDeploy: false
  scaling:
    minInstances: 1
    maxInstances: 5
    targetMemoryPercent: 60 
    targetCPUPercent: 60 
  envVars:
  - key: SERVER_PORT
    value: 4000
  - key: SERVER_HOST
    value: 0.0.0.0
  - key: POSTGRES_HOST
    fromDatabase:
      name: eyst-postgres
      property: host
  - key: POSTGRES_PORT
    fromDatabase:
      name: eyst-postgres
      property: port
  - key: POSTGRES_USERNAME
    fromDatabase:
      name: eyst-postgres
      property: user
  - key: POSTGRES_PASSWORD
    fromDatabase:
      name: eyst-postgres
      property: password
  - key: POSTGRES_DB
    fromDatabase:
      name: eyst-postgres
      property: database
  - key: AUTH0_DOMAIN
    sync: false
  - key: AUTH0_CONNECTION
    sync: false
  - key: AUTH0_INDENTIFIER
    sync: false
  - key: AUTH0_MANAGEMENT_CLIENT_ID
    sync: false
  - key: AUTH0_MANAGEMENT_CLIENT_SECRET
    sync: false
  - fromGroup: backend-env-group

databases:
- name: eyst-postgres
  plan: standard
  databaseName: eyst_production
  user: some_user
